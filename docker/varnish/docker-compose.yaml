version: '3.9'
name: local
services:
  varnish:
    image: varnish:stable
    container_name: varnish
    ports:
      - 88:80
    environment:
      - VARNISH_SIZE=2G # Set Varnish cache size to 2 Gigabytes
      # Other Varnish environment variables can be added here, e.g.,
      # - VCL_CONFIG=/etc/varnish/default.vcl
      # - VARNISHD_PARAMS="-p default_ttl=3600"      
    volumes:
      - c:\db\varnish\data\default.vcl:/etc/varnish/default.vcl
    extra_hosts:
      - "host.docker.internal:host-gateway"


